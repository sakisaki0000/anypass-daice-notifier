name: anypass Da-iCE check

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分ごと（GitHub側の混雑で遅れることがあります）
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write           # seen.json（通知済みリスト）を保存するため

concurrency:
  group: anypass-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check resale list
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ARTIST_KEYWORDS: ${{ vars.ARTIST_KEYWORDS || 'Da-iCE' }}
        run: python notifier.py
      - name: Save seen.json
        run: |
          if ! git diff --quiet seen.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json"
            git push
          fi
